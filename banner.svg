<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="Elvis R. Pino — Senior Full-Stack Engineer, Applied AI">
  <title>Elvis R. Pino — Senior Full-Stack Engineer, Applied AI</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E8A33D" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="stroke" x1="0" x2="1">
      <stop offset="0" stop-color="#8A5F1F"/>
      <stop offset="1" stop-color="#E8A33D"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { from { width: 0; } to { width: 60px; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes pulse { 0%, 100% { r: 6; opacity: 1; } 50% { r: 10; opacity: 0.55; } }
      .r1 { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s both; }
      .r2 { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.35s both; }
      .r3 { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.6s both; }
      .r4 { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.75s both; }
      .rule { animation: grow 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.55s both; }
      .line { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 2.2s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards; }
      .area { opacity: 0; animation: fade 1.2s ease-out 1.6s forwards; }
      .dot { opacity: 0; animation: fade 0.4s ease-out 2.5s forwards; }
      .halo { animation: pulse 2.4s ease-in-out 2.9s infinite; }
      @media (prefers-reduced-motion: reduce) {
        .r1, .r2, .r3, .r4, .rule, .line, .area, .dot, .halo { animation: none; opacity: 1; stroke-dashoffset: 0; width: 60px; }
      }
    </style>
  </defs>

  <rect width="1600" height="400" fill="#0E1116"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <!-- chart -->
  <path class="area" fill="url(#fill)" d="M840 300 L900 285 L960 305 L1020 260 L1080 270 L1140 215 L1200 235 L1260 180 L1320 195 L1380 150 L1440 160 L1500 115 L1560 130 L1600 90 L1600 400 L840 400 Z"/>
  <path class="line" fill="none" stroke="url(#stroke)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" d="M840 300 L900 285 L960 305 L1020 260 L1080 270 L1140 215 L1200 235 L1260 180 L1320 195 L1380 150 L1440 160 L1500 115 L1560 130 L1600 90"/>
  <g class="dot">
    <circle class="halo" cx="1600" cy="90" r="6" fill="#E8A33D" opacity="0.5"/>
    <circle cx="1600" cy="90" r="5" fill="#E8A33D"/>
  </g>

  <!-- text -->
  <g class="r1">
    <text class="sans" x="88" y="150" font-size="68" font-weight="800" letter-spacing="-1.5" fill="#F3F5F7">Elvis R. Pino</text>
  </g>
  <g class="r2">
    <text class="mono" x="88" y="196" font-size="19" font-weight="600" letter-spacing="3.5" fill="#E8A33D">SENIOR FULL-STACK ENGINEER · APPLIED AI</text>
  </g>
  <rect class="rule" x="88" y="222" width="60" height="2" fill="#E8A33D"/>
  <g class="r3">
    <text class="mono" x="88" y="270" font-size="17" font-weight="600" letter-spacing="0.5" fill="#D6DBE1">TypeScript · Next.js · NestJS · .NET / C# · PostgreSQL</text>
  </g>
  <g class="r4">
    <text class="mono" x="88" y="298" font-size="16" letter-spacing="0.5" fill="#8B949E">Orlando, Florida · Open to relocation &amp; remote</text>
  </g>
</svg>
